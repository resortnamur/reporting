<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reporting — nouvelle adresse</title>

<!--
  Ce dépôt est public : il ne doit contenir que cette page.

  L'application et le classeur RESULTATS.xlsx ont été déplacés vers le dépôt
  privé resortnamur/reporting-app, servi par Cloudflare derrière un code
  d'accès vérifié côté serveur. Auparavant, le classeur était téléchargeable
  ici par simple adresse directe.

  Ne jamais remettre de données dans ce dépôt.

  Pour changer la destination, une seule ligne à modifier : DESTINATION,
  ci-dessous, et la balise <meta http-equiv="refresh"> juste après.
-->

<script>
  const DESTINATION = "https://reporting.ccrn.workers.dev/";
</script>
<meta http-equiv="refresh" content="3; url=https://reporting.ccrn.workers.dev/">

<style>
  :root { color-scheme: light dark; --fond:#f6f7f9; --carte:#fff; --texte:#1a1d23;
          --doux:#5b6472; --bord:#dfe3ea; --accent:#0891b2; }
  @media (prefers-color-scheme: dark) {
    :root { --fond:#0e1116; --carte:#171b22; --texte:#e8eaee;
            --doux:#9aa4b2; --bord:#2a313b; --accent:#22d3ee; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px;
         background:var(--fond); color:var(--texte);
         font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .carte { width:100%; max-width:420px; background:var(--carte); padding:30px;
           border:1px solid var(--bord); border-radius:16px;
           box-shadow:0 8px 30px rgba(16,20,30,.08); }
  .pastille { width:38px; height:38px; border-radius:11px; margin-bottom:16px;
              background:linear-gradient(135deg,var(--accent),#6366f1); }
  h1 { margin:0 0 6px; font-size:20px; letter-spacing:-.02em; }
  p { margin:0 0 14px; color:var(--doux); font-size:14px; }
  a.bouton { display:block; text-align:center; margin-top:18px; padding:13px;
             font-size:15px; font-weight:600; color:#fff; background:var(--accent);
             border-radius:11px; text-decoration:none; }
  .pied { margin:16px 0 0; font-size:12.5px; }
</style>
</head>
<body>
  <main class="carte">
    <div class="pastille"></div>
    <h1>Le reporting a déménagé</h1>
    <p>Vous allez être redirigé automatiquement. Si rien ne se passe, utilisez
       le bouton ci-dessous, puis mettez votre favori à jour.</p>
    <a class="bouton" id="lien" href="https://reporting.ccrn.workers.dev/">Ouvrir le reporting →</a>
    <p class="pied">Un code d'accès est désormais demandé. Il vous est communiqué
       par votre responsable.</p>
  </main>

<script>
  // Redirection immédiate quand JavaScript est actif ; la balise « refresh »
  // ci-dessus prend le relais dans le cas contraire, et le bouton reste
  // disponible si les deux échouent.
  document.getElementById("lien").href = DESTINATION;
  location.replace(DESTINATION);
</script>
</body>
</html>
